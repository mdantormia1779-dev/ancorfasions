name: Production Smoke Tests

on:
  workflow_run:
    workflows: ["Continuous Deployment"]
    types:
      - completed
  schedule:
    - cron: "0 */4 * * *" # Run every 4 hours

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Health Checks
        run: |
          echo "Testing Production Endpoints..."
          # Example curl to a health check endpoint
          curl -f https://your-production-domain.com/api/health || exit 1
          echo "Production is healthy."

      - name: Run Playwright Tests
        run: |
          npm install
          npx playwright install --with-deps
          npx playwright test tests/smoke.spec.ts
        env:
          BASE_URL: https://your-production-domain.com
